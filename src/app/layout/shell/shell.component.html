<div class="app-shell">
  <aside class="sidebar" [class.collapsed]="sidebarCollapsed">
    <div class="sidebar-logo">
      <span class="logo-icon">B2U</span>
      <span class="logo-text" *ngIf="!sidebarCollapsed">HUB</span>
    </div>

    <!-- Menu Student -->
    <nav class="sidebar-nav" *ngIf="isStudent">
      <a routerLink="/app/dashboard" routerLinkActive="active">
        <mat-icon>dashboard</mat-icon>
        <span *ngIf="!sidebarCollapsed">Dashboard</span>
      </a>
      <a routerLink="/app/my-company" routerLinkActive="active">
        <mat-icon>business</mat-icon>
        <span *ngIf="!sidebarCollapsed">Mon Entreprise</span>
      </a>
      <a routerLink="/app/projects" routerLinkActive="active">
        <mat-icon>work</mat-icon>
        <span *ngIf="!sidebarCollapsed">Offres / Projets</span>
      </a>
      <a routerLink="/app/candidatures" routerLinkActive="active">
        <mat-icon>description</mat-icon>
        <span *ngIf="!sidebarCollapsed">Mes Candidatures</span>
      </a>
      <a routerLink="/app/scoring" routerLinkActive="active">
        <mat-icon>analytics</mat-icon>
        <span *ngIf="!sidebarCollapsed">AI Score</span>
      </a>
      <a routerLink="/app/equipes" routerLinkActive="active">
        <mat-icon>groups</mat-icon>
        <span *ngIf="!sidebarCollapsed">Équipes</span>
      </a>
      
      <a routerLink="/app/profile" routerLinkActive="active">
        <mat-icon>person</mat-icon>
        <span *ngIf="!sidebarCollapsed">Mon Profil</span>
      </a>
    </nav>

    <!-- Menu Company -->
    <nav class="sidebar-nav" *ngIf="isCompany">
      <a routerLink="/app/dashboard" routerLinkActive="active">
        <mat-icon>dashboard</mat-icon>
        <span *ngIf="!sidebarCollapsed">Dashboard</span>
      </a>
      <a routerLink="/company/candidatures" routerLinkActive="active">
        <mat-icon>people</mat-icon>
        <span *ngIf="!sidebarCollapsed">Candidatures reçues</span>
      </a>
      <a routerLink="/app/profile" routerLinkActive="active">
        <mat-icon>business</mat-icon>
        <span *ngIf="!sidebarCollapsed">Mon Profil</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <button class="logout-btn" (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span *ngIf="!sidebarCollapsed">Déconnexion</span>
      </button>
    </div>
  </aside>

  <div class="main-area" [class.expanded]="sidebarCollapsed">
    <header class="topbar">
      <button class="menu-btn" (click)="sidebarCollapsed = !sidebarCollapsed">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="topbar-title">B2U-HUB</span>
      <div class="topbar-right">
        <div class="user-info" *ngIf="user">
          <span class="user-name">{{ user.firstName }} {{ user.lastName }}</span>
          <span class="role-badge" [ngClass]="user.role">{{ user.role }}</span>
        </div>
      </div>
    </header>
    <main class="page-content">
      <router-outlet></router-outlet>  <!-- ← ESSENTIEL pour afficher les pages enfants -->
    </main>
  </div>
</div>
