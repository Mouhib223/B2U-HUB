<div class="admin-shell">
  <aside class="admin-sidebar" [class.collapsed]="sidebarCollapsed">
    <div class="sidebar-header">
      <div class="admin-logo">
        <span class="logo-badge">B2U</span>
        <span class="logo-label" *ngIf="!sidebarCollapsed">Admin</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a
        *ngFor="let item of menuItems"
        [routerLink]="item.route"
        routerLinkActive="active"
        class="nav-item"
      >
        <mat-icon>{{ item.icon }}</mat-icon>
        <span *ngIf="!sidebarCollapsed">{{ item.label }}</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <a routerLink="/app/dashboard" class="nav-item switch-link">
        <mat-icon>swap_horiz</mat-icon>
        <span *ngIf="!sidebarCollapsed">Front office</span>
      </a>
      <button class="nav-item logout-btn" (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span *ngIf="!sidebarCollapsed">Deconnexion</span>
      </button>
    </div>
  </aside>

  <div class="admin-main" [class.expanded]="sidebarCollapsed">
    <header class="admin-topbar">
      <button class="toggle-btn" (click)="sidebarCollapsed = !sidebarCollapsed" title="Menu">
        <mat-icon>menu</mat-icon>
      </button>

      <div class="topbar-heading">
        <span class="topbar-title">Back Office</span>
        <span class="topbar-subtitle">Administration B2U-HUB</span>
      </div>

      <div class="topbar-right">
        <div class="user-info" *ngIf="user$ | async as u">
          <span class="avatar">{{ initials(u.firstName, u.lastName) }}</span>
          <span class="user-name">{{ u.firstName }} {{ u.lastName }}</span>
          <span class="admin-badge">Admin</span>
        </div>
      </div>
    </header>

    <main class="admin-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
