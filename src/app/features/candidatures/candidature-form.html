<div class="cand-page">
  <div class="cand-card">
    <div class="cand-header">
      <h1>Soumettre une Candidature</h1>
      <p>Remplissez le formulaire ci-dessous pour postuler</p>
    </div>

    <div class="success-banner" *ngIf="success">
      ✅ Votre candidature a été soumise avec succès !
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>

      <!-- Informations personnelles -->
      <section class="form-section">
        <h2 class="section-title">Informations personnelles</h2>
        <div class="form-grid">
          <div class="field">
            <label>Nom *</label>
            <input formControlName="nomCandidat" placeholder="Votre nom" />
            <span class="err" *ngIf="submitted && f['nomCandidat'].errors?.['required']">Obligatoire</span>
          </div>
          <div class="field">
            <label>Prénom *</label>
            <input formControlName="prenomCandidat" placeholder="Votre prénom" />
            <span class="err" *ngIf="submitted && f['prenomCandidat'].errors?.['required']">Obligatoire</span>
          </div>
          <div class="field">
            <label>Email *</label>
            <input formControlName="email" type="email" placeholder="email@exemple.com" />
            <span class="err" *ngIf="submitted && f['email'].errors">Email invalide</span>
          </div>
          <div class="field">
            <label>Téléphone *</label>
            <input formControlName="telephone" placeholder="55 000 000" />
            <span class="err" *ngIf="submitted && f['telephone'].errors?.['required']">Obligatoire</span>
          </div>
          <div class="field">
            <label>Adresse</label>
            <input formControlName="adresse" placeholder="Ville, Pays" />
          </div>
        </div>
      </section>

      <!-- Formation & Expérience -->
      <section class="form-section">
        <h2 class="section-title">Formation & Expérience</h2>
        <div class="form-grid">
          <div class="field">
            <label>Formation actuelle</label>
            <select formControlName="formationActuelle">
              <option value="">-- Choisir --</option>
              <option *ngFor="let f of formations" [value]="f">{{ f }}</option>
            </select>
          </div>
          <div class="field">
            <label>Spécialité</label>
            <input formControlName="specialite" placeholder="Ex: Informatique" />
          </div>
          <div class="field">
            <label>Années d'expérience *</label>
            <input formControlName="anneeExperience" type="number" min="0" />
            <span class="err" *ngIf="submitted && f['anneeExperience'].errors">Valeur invalide</span>
          </div>
          <div class="field">
            <label>Compétences <small>(séparées par virgule)</small></label>
            <input formControlName="competences" placeholder="Angular, Java, SQL..." />
          </div>
        </div>
      </section>

      <!-- Candidature -->
      <section class="form-section">
        <h2 class="section-title">Détails de la candidature</h2>
        <div class="form-grid">
          <div class="field">
            <label>Statut *</label>
            <select formControlName="statutCandidature">
              <option *ngFor="let s of statuts" [value]="s">{{ s }}</option>
            </select>
          </div>
          <div class="field full">
            <label>Lien CV</label>
            <input formControlName="cvLien" placeholder="https://..." />
          </div>
          <div class="field full">
            <label>Lettre de motivation</label>
            <textarea formControlName="lettreMotivation" rows="4" placeholder="Décrivez votre motivation..."></textarea>
          </div>
        </div>
      </section>

      <div class="form-actions">
        <button type="submit" class="btn-primary">Soumettre la candidature</button>
      </div>
    </form>
  </div>
</div>
