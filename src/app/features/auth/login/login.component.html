<div class="auth-page">
  <div class="auth-brand">
    <div class="brand-logo">B2U</div>
    <h1>Welcome to B2U-HUB</h1>
    <p>The platform connecting student talent with real-world projects.</p>
  </div>

  <div class="auth-form-wrap">
    <div class="auth-card">
      <h2>Sign in</h2>
      <p class="auth-sub">Enter your credentials to access your account</p>

      <div class="error-banner" *ngIf="error">{{ error }}</div>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" type="email" placeholder="you@example.com">
          <mat-error *ngIf="form.get('email')?.hasError('required')">Email is required</mat-error>
          <mat-error *ngIf="form.get('email')?.hasError('email')">Enter a valid email</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput formControlName="password" type="password">
          <mat-error *ngIf="form.get('password')?.hasError('required')">Password is required</mat-error>
          <mat-error *ngIf="form.get('password')?.hasError('minlength')">Minimum 6 characters</mat-error>
        </mat-form-field>

        <button class="btn-primary full-width" type="submit" [disabled]="loading">
          <mat-spinner diameter="18" *ngIf="loading"></mat-spinner>
          <span *ngIf="!loading">Sign In</span>
        </button>
      </form>

      <p class="auth-link">Don't have an account? <a routerLink="/auth/register">Register</a></p>
    </div>
  </div>
</div>
