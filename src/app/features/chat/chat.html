<div class="chat-container">

  <div class="header">
    Team Chat - {{ roomId }}
  </div>

  <div class="messages">
    <div *ngFor="let msg of messages"
         [class.me]="msg.sender === 'student'"
         class="message">
      {{ msg.content }}
    </div>
  </div>

  <div class="input-box">
    <input [(ngModel)]="message" placeholder="Type message..." />
    <button (click)="sendMessage()">Send</button>
  </div>

</div>
